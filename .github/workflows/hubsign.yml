        run: |
          mkdir -p b
          python3 - <<'EOF'
          import base64, gzip, os, plistlib, json, urllib.request, copy

          raw = gzip.decompress(base64.b64decode(os.environ['BLOB']))
          A = plistlib.loads(raw)

          # Variante B: WFNumberValue als WFTextTokenString statt Attachment
          B = copy.deepcopy(A)
          n = 0
          for act in B['WFWorkflowActions']:
              p = act['WFWorkflowActionParameters']
              if act['WFWorkflowActionIdentifier'] == 'is.workflow.actions.conditional' \
                 and 'WFNumberValue' in p:
                  name = p['WFNumberValue']['Value']['VariableName']
                  p['WFNumberValue'] = {
                      'Value': {'string': '\ufffc',
                                'attachmentsByRange': {
                                    '{0, 1}': {'Type': 'Variable', 'VariableName': name}}},
                      'WFSerializationType': 'WFTextTokenString'}
                  n += 1
          print('Variante B: %d Bedingungen umgeschrieben' % n)
          assert n == 2

          def sign(pl, name, out):
              xml = plistlib.dumps(pl, fmt=plistlib.FMT_XML).decode('utf-8')
              body = json.dumps({'shortcutName': name, 'shortcut': xml}).encode()
              req = urllib.request.Request(
                  'https://hubsign.routinehub.services/sign', data=body,
                  headers={'Content-Type': 'application/json',
                           'User-Agent': 'cherri/2.0.0'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  data = r.read()
              print(name, 'status', r.status, 'bytes', len(data), 'magic', data[:4])
              assert data[:4] == b'AEA1', name + ': keine signierte Datei'
              open(out, 'wb').write(data)

          sign(A, 'Instagram-Gate-A', 'b/Instagram-Gate-A.shortcut')
          sign(B, 'Instagram-Gate-B', 'b/Instagram-Gate-B.shortcut')
          EOF
          ls -l b/

      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signiert
          path: b/

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create -R Blockbooster1/instagram-gate "sign-${{ github.run_number }}" \
            b/Instagram-Gate-A.shortcut b/Instagram-Gate-B.shortcut \
            --title "Instagram-Gate Varianten A und B" \
            --notes "A: WFNumberValue als Attachment. B: WFNumberValue als TextTokenString."
