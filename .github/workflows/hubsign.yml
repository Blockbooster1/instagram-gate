        run: |
          mkdir -p b
          python3 -c "import base64,gzip,os;open('b/Instagram-Gate.plist','wb').write(gzip.decompress(base64.b64decode(os.environ['BLOB'])))"
          python3 - <<'EOF'
          import json, urllib.request
          xml = open('b/Instagram-Gate.plist','rb').read().decode('utf-8')
          payload = json.dumps({"shortcutName": "Instagram-Gate", "shortcut": xml}).encode()
          req = urllib.request.Request("https://hubsign.routinehub.services/sign", data=payload,
                                       headers={"Content-Type": "application/json",
                                                "User-Agent": "cherri/2.0.0"})
          with urllib.request.urlopen(req, timeout=90) as r:
              data = r.read()
              print("status", r.status, "bytes", len(data))
          open('b/Instagram-Gate.shortcut', 'wb').write(data)
          print("magic:", data[:4])
          assert data[:4] == b"AEA1", "Antwort ist keine signierte Datei"
          EOF
          ls -l b/

      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signiert
          path: b/

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create -R Blockbooster1/instagram-gate "sign-${{ github.run_number }}" b/Instagram-Gate.shortcut \
            --title "Instagram-Gate signiert" \
            --notes "Signiert via HubSign (RoutineHub)."
