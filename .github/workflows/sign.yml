        run: |
          mkdir -p build
          python3 -c "import base64,gzip,os;open('build/Instagram-Gate.plist','wb').write(gzip.decompress(base64.b64decode(os.environ['BLOB'])))"
          ls -l build/Instagram-Gate.plist
          plutil -lint build/Instagram-Gate.plist

      - name: Umgebung protokollieren
        run: |
          sw_vers | tee -a build/sign.log
          which shortcuts | tee -a build/sign.log || echo "shortcuts CLI FEHLT" | tee -a build/sign.log
          shortcuts --help 2>&1 | head -30 | tee -a build/sign.log || true

      - name: Signieren (mehrere Varianten)
        id: sign
        continue-on-error: true
        run: |
          IN=build/Instagram-Gate.plist
          OUT=build/Instagram-Gate.shortcut
          ok=""
          try() {
            echo "=== Versuch: $1 ===" | tee -a build/sign.log
            if shortcuts sign --mode anyone --input "$2" --output "$OUT" >>build/sign.log 2>&1; then
              echo "ERFOLG: $1" | tee -a build/sign.log; return 0
            fi
            echo "--- fehlgeschlagen ---" | tee -a build/sign.log; return 1
          }
          try "xml" "$IN" && ok=1
          if [ -z "$ok" ]; then
            cp "$IN" build/in-bin.plist
            plutil -convert binary1 build/in-bin.plist >>build/sign.log 2>&1 || true
            try "binaer" build/in-bin.plist && ok=1
          fi
          if [ -z "$ok" ]; then
            open -a Shortcuts >>build/sign.log 2>&1 || true
            sleep 15
            try "binaer nach App-Start" build/in-bin.plist && ok=1
          fi
          if [ -z "$ok" ]; then
            echo "ALLE VARIANTEN FEHLGESCHLAGEN" | tee -a build/sign.log; exit 1
          fi

      - name: Ergebnis pruefen (AEA1)
        id: verify
        continue-on-error: true
        run: |
          OUT=build/Instagram-Gate.shortcut
          [ -f "$OUT" ] || { echo "Keine Ausgabedatei"; exit 1; }
          ls -l "$OUT" | tee -a build/sign.log
          MAGIC=$(head -c 4 "$OUT")
          echo "Magic: $MAGIC" | tee -a build/sign.log
          [ "$MAGIC" = "AEA1" ] || { echo "FEHLER: nicht signiert"; exit 1; }
          echo "signiert=ja" | tee -a build/sign.log

      - name: Logs hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signier-logs
          path: build/sign.log
          if-no-files-found: warn

      - name: Release anlegen
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" build/Instagram-Gate.shortcut \
            --title "Instagram-Gate v${{ github.run_number }}" \
            --notes "Signierter Kurzbefehl fuer iOS."

      - name: Fehlerfall
        if: steps.verify.outcome != 'success'
        run: |
          echo "--- sign.log ---"; cat build/sign.log || true; exit 1
